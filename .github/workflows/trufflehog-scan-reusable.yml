name: Reusable TruffleHog Workflow

on:
  workflow_call:
    inputs:
      base-ref:
        required: false
        type: string
        default: ''
      head-ref:
        required: false
        type: string
        default: 'HEAD'
      is-pr:
        required: false
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog CLI
        run: |
          pip install trufflehog==3.90.3

      - name: Run TruffleHog and save results
        id: scan
        run: |
          echo "🔍 Running TruffleHog from ${{ inputs.base-ref }} to ${{ inputs.head-ref }}"
          trufflehog git \
            --path ./ \
            --base ${{ inputs.base-ref }} \
            --head ${{ inputs.head-ref }} \
            --json > trufflehog-results.json || true

      - name: Show results (for debugging)
        run: cat trufflehog-results.json || echo "No results found"

      - name: Comment on PR if secrets are found
        if: inputs.is-pr == true && (success() || failure())
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const findings = fs.existsSync('trufflehog-results.json') 
              ? fs.readFileSync('trufflehog-results.json', 'utf8') 
              : '';

            if (findings.trim().length > 0) {
              const safe = findings.slice(0, 65000);
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚨 **TruffleHog detected potential secrets:**\n\n\`\`\`json\n${safe}\n\`\`\``
              });
            }

      - name: Fail if secrets are found
        if: success() || failure()
        run: |
          if [ -s trufflehog-results.json ]; then
            echo "❌ Secrets found. Failing the job."
            exit 1
          else
            echo "✅ No secrets found."
          fi
