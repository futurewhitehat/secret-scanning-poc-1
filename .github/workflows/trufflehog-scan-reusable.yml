name: Reusable TruffleHog Workflow

on:
  workflow_call:
    inputs:
      base-ref:
        required: false
        type: string
        default: ''
      head-ref:
        required: false
        type: string
        default: 'HEAD'
      is-pr:
        required: false
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        id: scan
        uses: trufflesecurity/trufflehog@v3.90.3  # Example valid version
        with:
          path: ./
          base: ${{ inputs.base-ref }}
          head: ${{ inputs.head-ref }}
          extra_args: --json

      - name: Save results
        run: echo "${{ steps.scan.outputs.results }}" > trufflehog-results.json

      - name: Comment on PR if secrets are found
        if: inputs.is-pr == true && steps.scan.outputs.results != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const findings = require('fs').readFileSync('trufflehog-results.json', 'utf8');
            const safe = findings.slice(0, 65000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚨 **TruffleHog detected potential secrets:**\n\n\`\`\`json\n${safe}\n\`\`\``
            });

      - name: Fail on secrets
        if: steps.scan.outputs.results != ''
        run: exit 1
