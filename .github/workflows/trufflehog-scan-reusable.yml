name: Reusable TruffleHog PR Scan - By Siva

on:
  workflow_call:
    inputs:
      base-ref:
        description: 'Base branch of the PR (e.g., main)'
        required: true
        type: string
      head-ref:
        description: 'Head branch of the PR (e.g., feature branch)'
        required: true
        type: string
      fail-on-secrets:
        description: 'Whether to fail the workflow when secrets are found'
        required: false
        type: boolean
        default: true
    secrets:
      GH_TOKEN:
        description: 'GitHub token for commenting on PRs'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog CLI
        run: |
          curl -L https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog-linux-amd64 -o trufflehog
          chmod +x trufflehog
          sudo mv trufflehog /usr/local/bin/

      - name: Run TruffleHog on PR diff
        id: run-trufflehog
        run: |
          git fetch origin ${{ inputs.base-ref }}
          DIFF_RANGE="origin/${{ inputs.base-ref }}...${{ inputs.head-ref }}"
          echo "Scanning diff: $DIFF_RANGE"
          trufflehog git --only-verified \
            --diff "$DIFF_RANGE" \
            --json > findings.json || true

          if [[ -s findings.json ]]; then
            echo "Secrets found"
            echo "true" > found_secrets.flag
            head -c 65000 findings.json > short_findings.json
          else
            echo "No secrets found"
          fi

      - name: Comment findings on PR
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'short_findings.json';
            const flag = 'found_secrets.flag';
            if (fs.existsSync(flag)) {
              const findings = fs.readFileSync(path, 'utf8');
              const body = `🚨 **TruffleHog found potential secrets in this PR**\n\n\`\`\`json\n${findings}\n\`\`\`\nPlease review and remove any sensitive data.`;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Fail if secrets found and fail-on-secrets is true
        if: hashFiles('found_secrets.flag') != '' && inputs.fail-on-secrets == true
        run: |
          echo "Secrets found in PR. Failing the workflow."
          exit 1
